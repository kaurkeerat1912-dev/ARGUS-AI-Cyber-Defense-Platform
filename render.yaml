services:
  - type: web
    name: argus-ai-cyber-defense-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./forensics.sqlite3
      - key: OLLAMA_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: '["*"]'
