services:
  - type: web
    name: argus-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    plan: free
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        sync: false
